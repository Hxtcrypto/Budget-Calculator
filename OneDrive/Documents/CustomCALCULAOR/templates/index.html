<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Calc</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 55px;
            background: #fff;
            font-size: 22px;
            text-align: right;
            padding: 5px 12px;
            box-sizing: border-box;
            border: none;
            border-radius: 6px;
            margin-bottom: 15px;
            color: #333;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background-color: #444;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        .operator {
            background-color: #ff9500;
        }
        .operator:hover {
            background-color: #e08500;
        }
        .scientific {
            background-color: #3b5998;
        }
        .scientific:hover {
            background-color: #324c82;
        }
        .clear {
            background-color: #d9534f;
        }
        .clear:hover {
            background-color: #c9302c;
        }
        .equals {
            background-color: #28a745;
            grid-column: span 2;
        }
        .equals:hover {
            background-color: #218838;
        }
        .result-box {
            background: #fff;
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
        }
        .error { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <div class="calculator">
        <form method="POST" id="calcForm">
            <input type="text" id="display" readonly value="{% if result is not none %}{{ result }}{% else %}{{ num1 if num1 is not none else '' }}{% endif %}">
            
            <input type="hidden" name="num1" id="num1" value="{{ num1 if num1 is not none else '' }}">
            <input type="hidden" name="num2" id="num2" value="{{ num2 if num2 is not none else '' }}">
            <input type="hidden" name="operation" id="operation" value="">

            <div class="buttons">
                <button type="button" class="clear" onclick="clearCalculator()">C</button>
                <button type="button" class="scientific" onclick="setOp('sqrt')">sqrt</button>
                <button type="button" class="scientific" onclick="setOp('log')">log</button>
                <button type="button" class="operator" onclick="setOp('/')">/</button>

                <button type="button" class="scientific" onclick="setOp('sin')">sin</button>
                <button type="button" class="scientific" onclick="setOp('cos')">cos</button>
                <button type="button" class="scientific" onclick="setOp('tan')">tan</button>
                <button type="button" class="operator" onclick="setOp('*')">*</button>

                <button type="button" onclick="appendNum('7')">7</button>
                <button type="button" onclick="appendNum('8')">8</button>
                <button type="button" onclick="appendNum('9')">9</button>
                <button type="button" class="operator" onclick="setOp('-')">-</button>

                <button type="button" onclick="appendNum('4')">4</button>
                <button type="button" onclick="appendNum('5')">5</button>
                <button type="button" onclick="appendNum('6')">6</button>
                <button type="button" class="operator" onclick="setOp('+')">+</button>

                <button type="button" onclick="appendNum('1')">1</button>
                <button type="button" onclick="appendNum('2')">2</button>
                <button type="button" onclick="appendNum('3')">3</button>
                <button type="button" class="operator" onclick="setOp('^')">^</button>

                <button type="button" onclick="appendNum('0')">0</button>
                <button type="button" onclick="appendNum('.')">.</button>
                <button type="button" class="equals" onclick="submitCalc()">=</button>
            </div>
        </form>

        {% if error is not none %}
            <div class="result-box">
                <div class="error">{{ error }}</div>
            </div>
        {% endif %}
    </div>

    <script>
        let currentInput = document.getElementById('display').value;
        let num1Stored = null;
        let selectedOp = null;

        function appendNum(val) {
            currentInput += val;
            document.getElementById('display').value = currentInput;
        }

        function setOp(op) {
            if (currentInput === '' && op === '-') {
                currentInput = '-';
                document.getElementById('display').value = currentInput;
                return;
            }
            if (currentInput === '') return;

            num1Stored = currentInput;
            selectedOp = op;
            currentInput = '';
            document.getElementById('display').value = '';
        }

        function submitCalc() {
            if (num1Stored !== null && selectedOp !== null) {
                document.getElementById('num1').value = num1Stored;
                document.getElementById('num2').value = currentInput;
                document.getElementById('operation').value = selectedOp;
                document.getElementById('calcForm').submit();
            } else if (['sqrt', 'log', 'sin', 'cos', 'tan'].includes(selectedOp) || currentInput !== '') {
                document.getElementById('num1').value = currentInput;
                document.getElementById('num2').value = '0';
                document.getElementById('operation').value = selectedOp;
                document.getElementById('calcForm').submit();
            }
        }

        function clearCalculator() {
            currentInput = '';
            num1Stored = null;
            selectedOp = null;
            document.getElementById('display').value = '';
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('operation').value = '';
        }
    </script>
</body>
</html>
